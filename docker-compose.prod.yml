# Production stack: the app talks to a Postgres container instead of SQLite.
# Run with:  docker compose -f docker-compose.prod.yml up -d --build
#
# POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB are read from the .env file
# in this directory (Compose auto-loads it for ${...} substitution).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # App must not start connecting until Postgres is actually accepting queries.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  quizzable:
    container_name: quizzable
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides the SQLite default in quizzable.config; `db` is the service name above.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8080:8080"
    volumes:
      # Secrets (SECRET_KEY, STORAGE_SECRET) supplied read-only; kept out of the image.
      - ./.env:/app/.env:ro
      # Persist NiceGUI user storage (login sessions) across restarts.
      - nicegui_storage:/app/.nicegui
    restart: unless-stopped

volumes:
  pgdata:
  nicegui_storage:
