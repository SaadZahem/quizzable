[project]
name = "quizzable"
version = "0.3.10"
description = "Website for sharing quizzes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.15.0",
    "nest-asyncio>=1.6.0",
    "nicegui>=3.14.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt[crypto]>=2.13.0",
    "pytest-asyncio>=1.4.0",
    "pytest-selenium>=4.1.0",
    "tortoise-orm>=1.1.7",
]

[tool.tortoise]
tortoise_orm = "settings.TORTOISE_ORM"
