[project]
name = "quizzable"
version = "0.3.10"
description = "Website for sharing quizzes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.14.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tortoise-orm>=1.1.7",
]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "nest-asyncio>=1.6.0",
    "pytest-asyncio>=1.4.0",
    "pytest-selenium>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quizzable"]

[tool.tortoise]
tortoise_orm = "settings.TORTOISE_ORM"

[tool.pytest.ini_options]
asyncio_mode = "auto"
main_file = "main.py"
addopts = "-p nicegui.testing.plugin"
