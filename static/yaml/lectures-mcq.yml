title: Lectures MCQ
tags:
  - pediatrics
questions:
  - q: "The predominant pathogen in childhood empyema is:"
    a: "Streptococcus pneumoniae"
    b: "Methicillin resistant staphylococcus aureus"
    c: "Pseudomonas"
    d: "Mycobacterium tuberculosis"
    e: "Candida albicans"
    k: a

  - q: "The most common cause of pleural effusion in children is:"
    a: "Malignancy"
    b: "Congestive heart failure"
    c: "Infection"
    d: "Hypoalbuminemia"
    e: "Collagen diseases"
    k: c

  - q: "The cardinal manifestation of pneumothorax is:"
    a: "Dyspnea"
    b: "Tachypnea"
    c: "Sudden chest pain"
    d: "Cyanosis"
    e: "Tachycardia"
    k: c

  - q: "What is the most characteristic symptom of asthma?"
    a: "Tightness in the chest"
    b: "Wheezing"
    c: "Recurrence of the attacks"
    d: "Good response to b2 agonist"
    e: "Nocturnal cough"
    k: d

  - q: "The preferred first line therapy for asthma exacerbation is:"
    a: "Aminophylline IV"
    b: "B-agonist nebulization & systemic steroid"
    c: "Magnesium sulfate IV"
    d: "Systemic B agonist"
    e: "Montelukast"
    k: b

  - q: "Oral steroids and anti IgE can be added as treatment of bronchial asthma in:"
    a: "Step 1"
    b: "Step 2"
    c: "Step 3"
    d: "Step 4"
    e: "Step 5"
    k: e

  - q: "Which of the following is not true about acute epiglottitis?"
    a: "Fulminating course of high fever"
    b: "Toxic appearance"
    c: "Drooling of saliva"
    d: "Good response to nebulized adrenaline"
    k: d

  - q: "Features not suggestive of GAS pharyngitis include:"
    a: "Absence of cough"
    b: "Presence of tonsillar exudates or swelling"
    c: "Presence of ulcerative mouth lesions"
    d: "Presence of swollen and tender anterior cervical lymph nodes"
    e: "Age younger than 15 years"
    k: c

  - q: "The disease 'whooping cough' is caused by:"
    a: "Corynebacterium diptheria"
    b: "Bordetella pertussis"
    c: "Salmonella typhi"
    d: "None of these"
    k: b

  - q: "A 13-month-old child is at the 5th percentile for weight, the 10th percentile for height, and less than the 5th percentile for head circumference. She was born at term, was noted to have a small head at birth, was developmentally delayed, and required cataract surgery shortly after birth. She currently takes Phenobarbital for seizures. Which of the following would most likely explain this child's small size?"
    a: "Congenital Cytomegalovirus infection"
    b: "Down syndrome"
    c: "Hypothyroidism"
    d: "Craniopharyngioma"
    k: a

  - q: "Teratogenic factors are responsible for:"
    a: "5% congenital anomalies"
    b: "10% congenital anomalies"
    c: "13% congenital anomalies"
    d: "15% congenital anomalies"
    e: "3% congenital anomalies"
    k: b

  - q: "Maternal systemic lupus has teratogenic effect(s):"
    a: "Congenital heart disease"
    b: "Complete heart block"
    c: "Congenital heart disease and Complete heart block"
    d: "Renal failure and adrenal failure"
    e: "Adrenal failure and complete heart block"
    k: b

  - q: "Mother gets pregnant while taking oral contraceptive (combined progesterone and estrogen), what are the possible teratogenic effect(s)?"
    a: "2 to 4 fold increase in VATER association"
    b: "Sirenomelia"
    c: "Neural tube defect"
    d: "Intracranial calcification"
    k: a

  - q: "The following statement is correct as regard teratogenic agents that cause neural tube defect:"
    a: "Anticonvulsant, carbamazepine and Trimethoprime"
    b: "Maternal hyperthermia, Tetracycline and HIV"
    c: "Tobacco, phenobarbitone and Trimethoprime"
    d: "Sodium valporate, Trimethoprime and maternal hyperthermia"
    e: "Maternal diabetes, maternal hyperthermia and sodium valporate"
    k: d

  - q: "A newborn baby with dysmorphic features has vomiting since birth (on IV fluids) and a heart murmur. Karyotyping revealed: 46, XY, t(21q, 14q). Diagnosis of this case is:"
    a: "Turner syndrome"
    b: "Down syndrome"
    c: "Klinefelter syndrome"
    d: "Non of the above"
    k: b

  - q: "A newborn with Down syndrome has persistent vomiting since birth. The most likely cause of vomiting is:"
    a: "Physiologic regurge"
    b: "Gastro esophageal reflux"
    c: "Duodenal atresia"
    d: "Pyloric stenosis"
    k: c

  - q: "In a newborn with Down syndrome and a heart murmur, the commonest cardiac lesion causing the murmur is:"
    a: "Common AV canal defect"
    b: "VSD"
    c: "PDA"
    d: "ASD"
    k: a

  - q: "In a Robertsonian translocation Down syndrome, if one of the parents is a carrier, the risk of an affected sibling is:"
    a: "100%"
    b: "5%"
    c: "10%"
    d: "30%"
    k: d

  - q: "Prenatal diagnosis for the next pregnancy in the first trimester includes one of the following:"
    a: "Amniocentesis"
    b: "Chorionic villous sampling"
    c: "Triple test"
    d: "Quadriple test"
    e: "All of the above"
    k: b

  - q: "The complications of TOF include all of the following except:"
    a: "Bleeding tendency"
    b: "Anoxic infarction of CNS"
    c: "Brain abscess"
    d: "Heart failure"
    e: "Infective endocarditis"
    k: d

  - q: "Treatment of hypercyanotic spell includes all of the following except:"
    a: "Propranolol"
    b: "Digoxin"
    c: "Morphine"
    d: "Sodium bicarbonate"
    e: "Oxygen"
    k: b

  - q: "Features of hypercyanotic spell are all of the following except:"
    a: "Increasing cyanosis"
    b: "Increase the intensity of murmur"
    c: "Hyperpnea"
    d: "Irritability"
    e: "Lethergy"
    k: b

  - q: "Congenital cyanotic heart diseases are all the followings except:"
    a: "Transposition of great arteries"
    b: "Patent ductus arteriosus"
    c: "Tetralogy of Fallot"
    d: "Tricuspid atresia"
    e: "Pulmonary atresia"
    k: b

  - q: "The drug of choice in newborn with tetralogy of Fallot and pulmonary atresia is:"
    a: "Furosemide"
    b: "Digoxin"
    c: "Prostaglandin E1"
    d: "Propranolol"
    e: "Morphine"
    k: c

  - q: "The following cardiac lesions are at increased risk for bacterial endocarditis EXCEPT:"
    a: "Mitral insufficiency"
    b: "Aortic stenosis"
    c: "Atrial septal defect seccundum"
    d: "Coarctation of the aorta"
    e: "Patent ductus arteriosus"
    k: c

  - q: "The leading causative agent for endocarditis in pediatric patients is:"
    a: "Viral infection"
    b: "Staphylococcus aureus"
    c: "Pseudomonas aeruginosa"
    d: "Fungal organisms"
    e: "Serratia marcescens"
    k: b

  - q: "The following is a major Duke criterion for the diagnosis of endocarditis:"
    a: "New valve regurgitant flow by echocardiography"
    b: "Osler nodes"
    c: "Single positive blood culture"
    d: "Fever"
    e: "High erythrocyte sedimentation rate"
    k: a

  - q: "A 15-year-old female presents following a sore throat with chest pain, fever, and a skin rash. Examination reveals a diastolic murmur. Her ASO titre is elevated. Which of the following is a major criterion for the diagnosis of Rheumatic fever?"
    a: "Fever"
    b: "Raised ESR"
    c: "Polyarthritis"
    d: "Migratory erythema"
    e: "Prolonged PR interval"
    k: c

  - q: "Marasmus definition according to Wellcome classification is:"
    a: "Wt loss <40% plus edema"
    b: "Wt loss >40% plus edema"
    c: "Wt loss >40% without edema"
    d: "Wt loss <50% plus edema"
    k: c

  - q: "Essential criteria of kwashiorkor (KWO) does not include:"
    a: "Growth retardation"
    b: "Edema"
    c: "Psychomotor changes"
    d: "Hair changes"
    k: d

  - q: "In laboratory investigations of infantile rickets:"
    a: "S. Ca, P: low, alk phosphatase: high"
    b: "S. Ca, P: high, alk phosphatase: high"
    c: "S. Ca, P: high, alk phosphatase: low"
    d: "S. Ca: low, P: high, alk phosphatase: high"
    k: a

  - q: "The only type of rickets associated with hyperphosphatemia is:"
    a: "Infantile rickets"
    b: "Renal rickets"
    c: "Vit D dependent rickets"
    d: "Hepatic rickets"
    k: b

  - q: "The hallmark of meningitis is:"
    a: "Altered consciousness"
    b: "Seizures"
    c: "Fever, headache & Vomiting"
    d: "Meningeal irritation signs"
    k: d

  - q: "The commonest pathogen of bacterial meningitis in a non-vaccinated 2 year old child is:"
    a: "S. pneumoniae"
    b: "H. influenzae b"
    c: "N. meningitidis"
    d: "L. monocytogenes"
    k: b

  - q: "Acyclovir is indicated for treatment of:"
    a: "Herpes simplex"
    b: "Enteroviruses"
    c: "Mumps"
    d: "Measles"
    k: a

  - q: "A 2 month old infant with bacterial meningitis is treated empirically with:"
    a: "Ceftriaxone + Ampicillin"
    b: "Ampicillin + Vancomycin"
    c: "Ampicillin"
    d: "Chloramphenicol"
    k: a

  - q: "The viral etiology is considered when CSF of a child shows:"
    a: "Lymphocytosis + mild protein increment"
    b: "Decreased glucose + lymphocytosis"
    c: "Neutrophilia + Normal glucose"
    d: "Neutrophilia + decreased glucose + -ve Gram stain"
    k: a

  - q: "A 3 day old boy presented by persistent vomiting followed by convulsions and disturbed conscious level. CSF was clear and showed 5 WBCs/ul, glucose 80mg/dl, protein 40mg/dl and negative gram stain. Blood glucose was 90mg/dl at the same time. You would interpret the CSF described above as:"
    a: "Normal"
    b: "Bacterial Meningitis"
    c: "Viral encephalitis"
    d: "TB Meningitis"
    k: a

  - q: "A 5-year-old girl was brought to the ED when she developed altered mental status. Kernig and Brudzinski signs were present. CSF examination showed WBCs 1500/ul (80% neutrophils), Sugar 20 mg/dl, Protein 400 mg/dl, Positive Gram stain. You would interpret the CSF described above as:"
    a: "Normal"
    b: "Bacterial Meningitis"
    c: "Viral encephalitis"
    d: "TB Meningitis"
    k: b

  - q: "A 3 years old child started to have perioral papulovesicular lesions. A few days later he became agitated, not himself, and soon unconscious. CSF was clear and showed glucose 70mg/dl, mildly elevated protein (150 mg/dl), WBC 300/ul mainly lymphocytes, and negative Gram stain. Blood glucose was 110mg/dl at the same time. You would interpret the CSF described above as:"
    a: "Normal"
    b: "Bacterial Meningitis"
    c: "Viral encephalitis"
    d: "TB Meningitis"
    k: c

  - q: "Cerebral palsy is defined as:"
    a: "Progressive motor disorder of upper motor neuron lesion"
    b: "Hereditary stationary motor disorder of upper motor neuron lesion"
    c: "Non hereditary stationary motor disorder of upper motor neuron lesion"
    d: "Non hereditary stationary motor disorder of lower motor neuron lesion"
    e: "Non hereditary progressive motor disorder of lower motor neuron lesion"
    k: c

  - q: "The core of definition and diagnosis of cerebral palsy is:"
    a: "Motor impairment"
    b: "Cognitive impairment"
    c: "Sensory impairment"
    d: "Epilepsy"
    e: "Mental retardation"
    k: a

  - q: "The type of spastic cerebral palsy that affects all four limbs is:"
    a: "Hemiplegic CP"
    b: "Diplegic CP"
    c: "Quadriplegic CP"
    d: "Paraplegic CP"
    e: "Monoplegic CP"
    k: c

  - q: "During the health supervision visit for a 6 week old boy, his father expresses concern that his son 'doesn't look like' his other children. Growth parameters are normal except for a head circumference of 35.5 cm (<5th percentile). On examination, the infant does not appear to fixate or track your face visually. There is a 'slip through' on vertical suspension and 'draping over' on horizontal suspension. DTRs are brisk. Moro reflex is present and brisk. Of the following, the MOST likely cause of this infant's hypotonia is:"
    a: "Anterior horn cell disease"
    b: "Congenital brain malformation"
    c: "Congenital myasthenic syndrome"
    d: "Congenital myopathy"
    e: "Spinal cord disease"
    k: b

  - q: "Which of the following is among the diagnostic criteria of birth asphyxia?"
    a: "Apgar score at 5 minutes < 5"
    b: "Neonatal encephalopathy"
    c: "Hypercalcemia"
    d: "Cord blood pH below 7.1"
    e: "EEG changes"
    k: b

  - q: "Which of the following might be among the laboratory findings in HIE?"
    a: "Low serum lactate"
    b: "Hypernatremia"
    c: "Hypoglycemia"
    d: "Hypercalcemia"
    e: "Severe alkalosis"
    k: c

  - q: "The most important investigation that should be done before discharge of a very low birth weight baby exposed to O2 for a long time:"
    a: "Retinal examination for retinopathy"
    b: "Transfontanelle U/S for intraventricular Hge"
    c: "X-ray chest for pneumonia"
    d: "Hearing test"
    e: "U/S abdomen"
    k: a

  - q: "The most common cause of apnea in a premature baby less than 32 weeks gestation is:"
    a: "Congenital pneumonia"
    b: "Hypocalcemia"
    c: "Primary apnea due to immaturity of respiratory center"
    d: "Gastro-oesophageal reflux"
    e: "Congenital heart disease"
    k: c

  - q: "Prevention of O2 complications could be achieved by keeping the O2 saturation and PaO2 at:"
    a: "SpO2 at 85% and PaO2 at 50mmHg"
    b: "SpO2 at 95-100% and PaO2 at 100mmHg"
    c: "SpO2 at 90-95% and PaO2 at 50-80mmHg"
    d: "SpO2 at 100% and PaO2 at 100mmHg"
    e: "SpO2 at 75% and PaO2 at 10mmHg"
    k: c

  - q: "The most common respiratory complication in preterm is:"
    a: "Pneumonia"
    b: "Bronchopulmonary dysplasia"
    c: "Respiratory distress syndrome"
    d: "Pneumothorax"
    e: "Congenital diaphragmatic hernia"
    k: b

  - q: "Broncho pulmonary dysplasia is defined as:"
    a: "Need for ventilator support for 2 weeks"
    b: "Irreversible damage of the lung in premature babies"
    c: "Persistent need for O2 supplementation at 28 days of life"
    d: "Persistent need for O2 for 3 months"
    e: "Persistent need for bronchodilator to treat bronchospasm resulting from exposure to O2"
    k: c

  - q: "Which of the following hormones are released from the posterior lobe of the pituitary gland?"
    a: "Growth Hormone (GH)"
    b: "Oxytocin"
    c: "Adreno-cortico-tropic Hormone (ACTH)"
    d: "Luteinizing Hormone (LH)"
    e: "Prolactin (Prl)"
    k: b

  - q: "In pan-hypopituitarism following surgical treatment, all the following would be expected except:"
    a: "Poor growth"
    b: "Hypernatraemia"
    c: "Delayed puberty"
    d: "Polyuria"
    e: "Diabetes mellitus"
    k: e

  - q: "All the following are true about ADH except:"
    a: "Synthetized by supra-optic nuclei of hypothalamus"
    b: "Result in increased urine osmolality & decreased urine volume"
    c: "Released from the posterior pituitary"
    d: "Acts on the collecting ducts"
    e: "Result in increased serum osmolality"
    k: e

  - q: "A one-week neonate presents with constipation, excess sleep, and difficult feeding. On examination the neonate shows cold skin, jaundice, open posterior fontanelle, slow pulse and edematous abnormal facies. Your most probable diagnosis is:"
    a: "Down syndrome"
    b: "Congenital hypothyroidism"
    c: "Congenital adrenal hyperplasia"
    d: "Turner syndrome"
    k: b

  - q: "A one-week neonate presents with constipation, excess sleep, difficult feeding, cold skin, jaundice, open posterior fontanelle, slow pulse and edematous facies. You will ask for the following investigations:"
    a: "Serum sodium and potassium"
    b: "TSH, free T4"
    c: "Karyotyping"
    d: "Serum cortisol and ACTH"
    k: b

  - q: "A one-week neonate presents with features suggestive of congenital hypothyroidism. If the investigations are abnormal for this condition, what is the drug of choice for treatment?"
    a: "Oral hydrocortisone"
    b: "ORS solution"
    c: "L-thyroxin therapy"
    d: "None of the above"
    k: c
