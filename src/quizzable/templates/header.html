<style type="text/tailwindcss">
    @theme static {
    --color-primary: ${primary};
    --color-secondary: ${secondary};
    --color-accent: ${accent};
    --color-myblack: ${myblack};
    --color-mywhite: ${mywhite};
    --color-brand: ${brand};

    --breakpoint-xs: 30rem;
  }
</style>

<style>
    /* App-wide text selection color, using the theme's accent color */
    ::selection {
        background-color: var(--color-secondary);
        color: var(--color-myblack);
    }
</style>
